<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Talk</title>
<meta name="description" content="Fun, family-friendly conversation starters for any table.">
<meta name="theme-color" content="#EFE4DA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23161616'/><text x='50' y='68' font-size='54' text-anchor='middle'>💬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Table Talk theme: warm neutrals + soft pastel category colors ---- */
  :root {
    --bg: #EFE4DA;            /* warm beige page */
    --surface: #FAF8F6;       /* off-white panels */
    --surface-2: #F1ECE7;     /* quiet fills (round buttons, inputs) */
    --ink: #161616;           /* near-black text + primary button */
    --ink-soft: #3A3633;
    --muted: #7B746E;
    --line: #E4DAD0;
    --on-primary: #FFFFFF;
    --shadow: 0 18px 40px rgba(90, 60, 40, .12);
    --radius-xl: 32px; --radius-lg: 24px; --radius-pill: 999px;
    /* category pastels (cards stay light in both modes, so text on them is always --cat-ink) */
    --lavender: #C9CCF7; --butter: #EBDB8F; --mint: #CFE3DC; --blush: #EAD9CF;
    --rose: #F4C9CF; --sage: #C3CBA4; --sky: #B3C9EE; --cat-ink: #161616;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171413; --surface: #221E1C; --surface-2: #2D2826; --ink: #F4EFEA; --ink-soft: #D9D1CA;
      --muted: #A89F97; --line: #37302C; --on-primary: #161616; --shadow: 0 18px 40px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171413; --surface: #221E1C; --surface-2: #2D2826; --ink: #F4EFEA; --ink-soft: #D9D1CA;
    --muted: #A89F97; --line: #37302C; --on-primary: #161616; --shadow: 0 18px 40px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Urbanist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 4px 4px 0; }
  .mark { width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: var(--on-primary);
    display: grid; place-items: center; font-size: 22px; flex: none; }
  .eyebrow { font-size: .85rem; color: var(--muted); margin: 18px 0 4px; font-weight: 500; letter-spacing: .01em; }
  h1 { font-size: clamp(2.1rem, 8vw, 2.8rem); line-height: 1.05; margin: 0; font-weight: 300; letter-spacing: -.02em; }
  h1 b { font-weight: 700; }
  .sub { color: var(--muted); margin: 8px 0 0; font-size: 1rem; line-height: 1.45; max-width: 34ch; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { --dot: var(--line); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); border-radius: var(--radius-pill); padding: 9px 14px 9px 11px;
    font: inherit; font-size: .92rem; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  .chip::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); flex: none; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-primary); border-color: var(--ink); }

  .card { --cat: var(--surface); position: relative; overflow: hidden; background: var(--cat); color: var(--cat-ink);
    border-radius: var(--radius-xl); min-height: 300px; padding: 26px 24px 28px; display: flex; flex-direction: column;
    box-shadow: var(--shadow); cursor: pointer; transition: background .35s ease; }
  .card.empty { color: var(--ink); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cat { font-size: .82rem; font-weight: 600; letter-spacing: .02em; background: rgba(255,255,255,.55);
    color: var(--cat-ink); padding: 6px 12px; border-radius: var(--radius-pill); }
  .card.empty .cat { background: var(--surface-2); color: var(--ink); }
  .badge { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.55); display: grid; place-items: center; font-size: 18px; }
  .card.empty .badge { background: var(--surface-2); }
  .q { font-size: clamp(1.55rem, 6vw, 2.1rem); line-height: 1.22; margin: auto 0 0; padding-top: 28px; font-weight: 500;
    letter-spacing: -.01em; max-width: 20ch; position: relative; }
  .art { position: absolute; right: -14px; bottom: -22px; font-size: 128px; opacity: .16; pointer-events: none; line-height: 1; }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .dock { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface);
    border-radius: var(--radius-pill); padding: 8px; box-shadow: var(--shadow); }
  .round { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink);
    font: inherit; font-size: 1.3rem; cursor: pointer; display: grid; place-items: center; flex: none; }
  .primary { flex: 1; height: 54px; border: 0; border-radius: var(--radius-pill); background: var(--ink); color: var(--on-primary);
    font: inherit; font-size: 1.08rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible, .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .below { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 8px; }
  .meta { color: var(--muted); font-size: .9rem; }
  .link { background: none; border: 0; color: var(--ink-soft); font: inherit; font-weight: 600; font-size: .92rem;
    cursor: pointer; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
  footer { color: var(--muted); font-size: .82rem; text-align: center; line-height: 1.5; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .card { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="mark" aria-hidden="true">💬</div>
      <p class="eyebrow">Conversation starters</p>
      <h1>Let's get <b>talking</b></h1>
      <p class="sub">Pass the phone, read it out loud, and everyone answers.</p>
    </div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Question categories"></div>

  <main class="card empty" tabindex="0" aria-live="polite" aria-label="Question card, tap for a new question">
    <div class="card-top"><span class="cat" id="cat">Ready when you are</span><span class="badge" id="badge" aria-hidden="true">✨</span></div>
    <p class="q" id="q">Tap “✨ New question” to start the conversation.</p>
    <span class="art" id="art" aria-hidden="true"></span>
  </main>

  <div class="dock">
    <button class="round" id="back" aria-label="Back to previous question" disabled>←</button>
    <button class="primary" id="gen">✨ New question</button>
    <button class="round" id="next" aria-label="Skip to next question">→</button>
  </div>
  <div class="below"><span class="meta" id="meta"></span><button class="link" id="copy">Copy</button></div>

  <footer>✨ makes up a brand-new question · → skips to the next one from the list<br>Keyboard: space = new · → = skip · ← = back</footer>
</div>

<script>
const QUESTIONS = {
  "Silly & Fun": [
    "If your pet could talk, what's the first thing it would complain about?",
    "What's the weirdest food combo you secretly love?",
    "If you were a kitchen appliance, which one would you be?",
    "What would your wrestling or superhero name be?",
    "What's a song you know every single word to?",
    "If you could only eat one color of food forever, which color?",
    "What's the most useless talent you have?",
    "If you had a theme song that played when you walked in, what would it be?",
    "What would you name a pet goldfish?",
    "What's your go-to dance move?",
    "If you could swap lives with a cartoon character for a day, who?",
    "What's the funniest word you know?"
  ],
  "Food & Feast": [
    "What's a dish you could eat every single week?",
    "Pizza or tacos — you can only pick one!",
    "Cake, pie, or ice cream?",
    "What's the best leftover sandwich you've ever made?",
    "If you could invent a brand-new dish, what would it be?",
    "Ketchup on everything — yes or no?",
    "What's your favorite holiday smell?",
    "Who in your family makes the best dessert?",
    "What's the most unusual food your family eats on holidays?",
    "Breakfast for dinner: yes or no?"
  ],
  "Would You Rather": [
    "Would you rather have dinner on a beach or in a snowy cabin?",
    "Would you rather only eat side dishes or only eat dessert?",
    "Would you rather talk to animals or speak every language?",
    "Would you rather have a pet dragon or a pet unicorn?",
    "Would you rather explore space or the bottom of the ocean?",
    "Would you rather live in a treehouse or a castle?",
    "Would you rather be able to fly or be invisible?",
    "Would you rather always have to sing or always have to dance?",
    "Would you rather eat pie for breakfast or pancakes for dinner?",
    "Would you rather have a robot chef or a robot that does dishes?"
  ],
  "Family Stories": [
    "What's a funny story your family always tells at holidays?",
    "Who's the best storyteller in your family?",
    "What's the best road trip your family ever took?",
    "What's a family nickname and how did it start?",
    "What's one thing your family is known for?",
    "What did your grandparents do for fun as kids?",
    "What's a family tradition you love?",
    "What's the funniest thing that ever happened at a family dinner?"
  ],
  "Thankful": [
    "What's one small thing that made you smile this year?",
    "Who at this table are you thankful for, and why?",
    "What's a simple everyday thing you're grateful for?",
    "What's your favorite memory from this year?",
    "What's something you learned this year that you're glad you know?",
    "What's a place you're thankful you got to visit?"
  ],
  "Holidays": [
    "What's your must-have Thanksgiving dish?",
    "Stuffing or mashed potatoes — you can only pick one!",
    "Pumpkin pie, apple pie, or pecan pie?",
    "Would you rather have Thanksgiving on a beach or in a snowy cabin?",
    "If a turkey could talk, what would it say?",
    "What's your favorite holiday tradition?",
    "What's the best present you've ever given someone?",
    "What's your favorite holiday movie?",
    "What's the best holiday decoration you've ever seen?",
    "What's your dream birthday party?",
    "What's one thing you want to try in the new year?"
  ],
  "Kids' Corner": [
    "If you were a food, what would you be?",
    "What superpower would you want and why?",
    "What's the silliest joke you know?",
    "If you could invent a new holiday, what would it celebrate?",
    "What animal would you be for a day?",
    "If your pet could talk, what would it say?",
    "If your toys came to life, which one would you hang out with?",
    "If you could make one rule for the whole world, what would it be?"
  ]
};

// ---- Question generator: mixes fun pieces into brand-new questions ----
// Each pattern is tagged with the categories it fits, so the category buttons apply to ✨ New question too.
const pick = a => a[Math.floor(Math.random() * a.length)];
const two = a => shuffle([...a]).slice(0, 2);
const G = {
  food: ["pizza","tacos","mac and cheese","pancakes","spaghetti","ice cream","popcorn","mashed potatoes","chocolate cake","corn on the cob","french fries","whipped cream"],
  holiday: ["Thanksgiving","the Fourth of July","Halloween","New Year's Eve","your birthday","Valentine's Day","the first day of summer","Christmas"],
  feast: ["pumpkin pie","stuffing","cranberry sauce","sweet potato casserole","gravy","pecan pie","green bean casserole","dinner rolls"],
  animal: ["a turkey","a penguin","a golden retriever","a sloth","a raccoon","a llama","a squirrel","a cat","a giraffe","an owl","a dolphin","a hedgehog"],
  person: ["a pirate","an astronaut","a famous chef","a wizard","a superhero","a cowboy","a mermaid","a detective","a rock star","a game show host"],
  place: ["the moon","a pirate ship","a castle","a tropical island","a treehouse","the North Pole","a giant cruise ship","a log cabin","a submarine","a hot air balloon"],
  power: ["fly","turn invisible","talk to animals","freeze time","teleport","read minds","breathe underwater","shrink to the size of an ant","make any food appear","become a giant"],
  thing: ["your shoes","the fridge","your car","the TV remote","your pillow","the family dog","the oven","your backpack","the couch","your phone"],
  activity: ["a pie-eating contest","a talent show","a family dance-off","a snowball fight","a pillow fort contest","a cooking competition","a karaoke battle","a trivia night","a backyard football game","a scavenger hunt"],
  decade: ["the 1920s","the 1950s","the 1970s","the 1980s","the 1990s","the year 3000"],
  job: ["zookeeper","ice cream taster","astronaut","chef","firefighter","video game designer","park ranger","pastry chef","marine biologist","inventor"],
  skill: ["ride a bike","cook","swim","tie your shoes","drive","bake cookies","play a card game","fish","dance","tell a good joke"],
  memory: ["a car ride","a holiday dinner","a family pet","a vacation","a birthday party","a snow day","a kitchen mishap","a camping trip","a wedding","a family game night"],
  favorite: ["song","meal","book","trip","surprise","movie","game","day","holiday tradition","outfit"],
  kindness: ["making you laugh","the best hugs","good advice","amazing cooking","always showing up","teaching you something","being patient with you"],
  season: ["fall","winter","spring","summer","the holidays","this past year"],
};
const TEMPLATES = [
  { cats: ["Food & Feast","Would You Rather"], make: () => `Would you rather eat ${pick(G.food)} every day for a year or never eat it again?` },
  { cats: ["Food & Feast","Would You Rather"], make: () => { const [a, b] = two(G.food); return `Would you rather give up ${a} or ${b} forever?`; } },
  { cats: ["Food & Feast"], make: () => `What's the best topping you could put on ${pick(G.food)}?` },
  { cats: ["Food & Feast","Kids' Corner"], make: () => `If ${pick(G.food)} were a person, what would its personality be like?` },
  { cats: ["Food & Feast","Silly & Fun"], make: () => `If ${pick(G.person)} cooked dinner tonight, what would be on the menu?` },
  { cats: ["Food & Feast","Family Stories"], make: () => `Who in your family makes the best ${pick(G.food)}?` },
  { cats: ["Would You Rather","Kids' Corner"], make: () => { const [a, b] = two(G.power); return `Would you rather be able to ${a} or ${b}?`; } },
  { cats: ["Would You Rather","Kids' Corner"], make: () => { const [a, b] = two(G.animal); return `Would you rather have ${a} or ${b} as a pet?`; } },
  { cats: ["Would You Rather","Silly & Fun"], make: () => { const [a, b] = two(G.place); return `Would you rather spend a weekend on ${a} or ${b}?`; } },
  { cats: ["Would You Rather"], make: () => { const [a, b] = two(G.activity); return `Would you rather win ${a} or ${b}?`; } },
  { cats: ["Silly & Fun"], make: () => `If you could have dinner on ${pick(G.place)}, who would you invite?` },
  { cats: ["Silly & Fun","Kids' Corner"], make: () => `If ${pick(G.animal)} came to dinner, what would it bring?` },
  { cats: ["Silly & Fun","Kids' Corner"], make: () => `If you were ${pick(G.person)} for a day, what would you do first?` },
  { cats: ["Silly & Fun","Kids' Corner"], make: () => `If you could ${pick(G.power)} for just one day, how would you use it?` },
  { cats: ["Silly & Fun","Kids' Corner"], make: () => `If ${pick(G.thing)} could talk, what would it say about you?` },
  { cats: ["Silly & Fun"], make: () => `If our family had ${pick(G.activity)}, what would your secret strategy be?` },
  { cats: ["Silly & Fun"], make: () => `What would family dinner look like in ${pick(G.decade)}?` },
  { cats: ["Silly & Fun"], make: () => `What's one thing you'd bring on a trip to ${pick(G.place)}?` },
  { cats: ["Kids' Corner"], make: () => `If you were a ${pick(G.job)}, what would your best day at work look like?` },
  { cats: ["Kids' Corner","Thankful"], make: () => `If you were ${pick(G.animal)}, what would you be most thankful for?` },
  { cats: ["Family Stories","Silly & Fun"], make: () => `Who at this table would win ${pick(G.activity)}?` },
  { cats: ["Family Stories"], make: () => `Who here would make the best ${pick(G.job)}, and why?` },
  { cats: ["Family Stories"], make: () => `What's a funny family story about ${pick(G.memory)}?` },
  { cats: ["Family Stories"], make: () => `What was your favorite ${pick(G.favorite)} growing up?` },
  { cats: ["Family Stories","Thankful"], make: () => `Who taught you how to ${pick(G.skill)}?` },
  { cats: ["Thankful"], make: () => `What's something about ${pick(G.season)} you're thankful for?` },
  { cats: ["Thankful"], make: () => `What's a ${pick(G.favorite)} from this year that made you happy?` },
  { cats: ["Thankful"], make: () => `Who at this table would you thank for ${pick(G.kindness)}?` },
  { cats: ["Thankful"], make: () => `If you lived in ${pick(G.decade)}, what would you miss most about today?` },
  { cats: ["Holidays"], make: () => `What's your favorite way to celebrate ${pick(G.holiday)}?` },
  { cats: ["Holidays","Silly & Fun"], make: () => `If ${pick(G.animal)} hosted ${pick(G.holiday)}, what would the party be like?` },
  { cats: ["Holidays","Would You Rather"], make: () => { const [a, b] = two(G.holiday); return `Would you rather celebrate ${a} or ${b} twice a year?`; } },
  { cats: ["Holidays","Food & Feast"], make: () => { const f = pick(G.feast); return `${f[0].toUpperCase()}${f.slice(1)}: love it or skip it?`; } },
  { cats: ["Holidays","Thankful"], make: () => `What's a memory from ${pick(G.holiday)} you're thankful for?` },
  { cats: ["Holidays","Kids' Corner"], make: () => `If you could invent a new tradition for ${pick(G.holiday)}, what would it be?` },
];
function generate() {
  const pool = TEMPLATES.filter(t => t.cats.some(c => active.has(c)));
  let t, q, tries = 0;
  do { t = pick(pool); q = t.make().replace(/\ba ([aeiou])/g, "an $1"); tries++; }
  while (history.some(h => h.q === q) && tries < 30);
  const fits = t.cats.filter(c => active.has(c));
  return { c: pick(fits), q, gen: true };
}

const cats = Object.keys(QUESTIONS);
let active = new Set(cats);
let deck = [], history = [], pos = -1, roundStart = 0;

const $ = id => document.getElementById(id);
const chips = $("chips");

// Each category's color + picture (colors are theme tokens above)
const STYLE = {
  "Silly & Fun": ["--lavender", "🤪"], "Food & Feast": ["--butter", "🍕"], "Would You Rather": ["--mint", "🤔"],
  "Family Stories": ["--blush", "🏡"], "Thankful": ["--rose", "💛"], "Holidays": ["--sage", "🎉"], "Kids' Corner": ["--sky", "🧸"],
};
const styleOf = c => STYLE[c] || ["--surface", "💬"];

function renderChips() {
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.textContent = "All";
  all.setAttribute("aria-pressed", active.size === cats.length);
  all.onclick = () => { active = new Set(cats); rebuild(); };
  chips.appendChild(all);
  for (const c of cats) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.style.setProperty("--dot", `var(${styleOf(c)[0]})`);
    b.setAttribute("aria-pressed", active.size !== cats.length && active.has(c));
    b.onclick = () => {
      if (active.size === cats.length) active = new Set([c]);
      else if (active.has(c)) { active.delete(c); if (!active.size) active = new Set(cats); }
      else active.add(c);
      rebuild();
    };
    chips.appendChild(b);
  }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function rebuild() {
  const seen = new Set(history.slice(roundStart).map(h => h.q));
  deck = shuffle(cats.filter(c => active.has(c)).flatMap(c => QUESTIONS[c].map(q => ({ c, q }))).filter(x => !seen.has(x.q)));
  renderChips(); updateMeta();
}

function show(item) {
  const qEl = $("q"), cEl = $("cat");
  qEl.classList.remove("fade"); void qEl.offsetWidth; qEl.classList.add("fade");
  cEl.textContent = item.gen ? `${item.c} · ✨ new` : item.c; qEl.textContent = item.q; updateMeta();
  const [color, pic] = styleOf(item.c), card = document.querySelector(".card");
  card.classList.remove("empty"); card.style.setProperty("--cat", `var(${color})`);
  $("art").textContent = pic; $("badge").textContent = item.gen ? "✨" : pic;
  $("back").disabled = pos <= 0;
}

function next() {
  if (pos < history.length - 1) { pos++; return show(history[pos]); }
  if (!deck.length) {
    roundStart = history.length; pos = history.length; $("back").disabled = pos <= 0;
    rebuild();
    $("cat").textContent = "You've seen them all! 🎉"; $("q").textContent = "Shuffling a fresh round. Tap → to keep going.";
    const card = document.querySelector(".card"); card.classList.add("empty"); card.style.removeProperty("--cat"); $("art").textContent = ""; $("badge").textContent = "🎉";
    return;
  }
  const item = deck.pop(); history.push(item); pos = history.length - 1; show(item);
}
function gen() {
  history = history.slice(0, pos + 1);
  const item = generate(); history.push(item); pos = history.length - 1; show(item);
}
function back() { if (pos > 0) { pos--; show(history[pos]); } }

function updateMeta() {
  const total = cats.filter(c => active.has(c)).reduce((n, c) => n + QUESTIONS[c].length, 0);
  $("meta").textContent = `${deck.length} of ${total} questions left in this round`;
}

$("next").onclick = next; $("back").onclick = back; $("gen").onclick = gen;
document.querySelector(".card").onclick = gen;
function copyFallback(text) {
  const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", "");
  t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
  let done = false; try { done = document.execCommand("copy"); } catch {} t.remove(); return done;
}
$("copy").onclick = async () => {
  const text = $("q").textContent, btn = $("copy");
  let done = false;
  try { await Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(no, 800))]); done = true; }
  catch { done = copyFallback(text); }
  btn.textContent = done ? "Copied!" : "Can't copy";
  setTimeout(() => btn.textContent = "Copy", 1200);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON") return;
  if (e.code === "Space") { e.preventDefault(); gen(); }
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") back();
  if (e.key === "Enter" && e.target.classList.contains("card")) gen();
});

rebuild();
</script>
</body>
</html>
